name: Supabase Keep-Alive

on:
  schedule:
    # Runs everyday at 12:00 UTC (9:00 AM BRT)
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  ping:
    name: Ping Supabase Project
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Secrets SUPABASE_URL or SUPABASE_ANON_KEY are not set. Skipping ping."
            exit 0
          fi
          echo "Sending keep-alive ping to Supabase..."
          curl -f -s -o /dev/null -w "HTTP status: %{http_code}\n" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/auth/v1/settings"
          echo "Supabase keep-alive ping completed successfully!"
