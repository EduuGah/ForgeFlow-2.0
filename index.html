<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0d0f12" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ForgeFlow" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>ForgeFlow 2.0</title>
    <meta
      name="description"
      content="Comprehensive fitness tracking, workout execution, hydration, nutrition, and personal record tracking application."
    />
    <meta property="og:title" content="ForgeFlow 2.0" />
    <meta
      property="og:description"
      content="Comprehensive fitness tracking, workout execution, hydration, nutrition, and personal record tracking application."
    />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/favicon-32.png"
    />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link
      rel="preload"
      href="/fonts/sora-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      // Applies the saved theme before the first paint (see web/lib/theme.ts).
      (function () {
        try {
          var saved = localStorage.getItem('forgeflow_theme');
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.dataset.theme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', theme === 'light' ? '#f3f4f6' : '#0d0f12');
        } catch (error) {}
      })();
    </script>
    <style>
      /* Static splash painted before the bundle loads; React replaces it. */
      html {
        background: #0d0f12;
      }
      html[data-theme='light'] {
        background: #f3f4f6;
      }
      .ff-boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      .ff-boot img {
        width: 72px;
        height: 72px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="ff-boot" aria-hidden="true">
        <img src="/icons/icon.svg" alt="" />
      </div>
    </div>
    <script type="module" src="/web/main.tsx"></script>
  </body>
</html>
