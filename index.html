<!doctype html>
<html lang="pt-BR" style="background: #000">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta property="og:title" content="ForgeFlow" />

      content="Registre treinos de força, acompanhe recordes pessoais, metas, hidratação e nutrição."

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&display=swap"
    />
    <style>
      /* Static splash painted before the bundle loads; React replaces it. */
      .ff-boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #000;
      }
      .ff-boot svg {
        width: 56px;
        height: 56px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="ff-boot" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none">
          <rect width="64" height="64" rx="16" fill="#0A6CF0" />
          <path d="M20 16h26v8H29v7h14v8H29v11h-9V16Z" fill="#fff" />
        </svg>
      </div>
    </div>
    <script type="module" src="/web/main.tsx"></script>
  </body>
</html>
